name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-pc-windows-gnu
            os: windows-latest
            target: x86_64-pc-windows-gnu
            archive: zip
            binary: agentdoctor.exe
          - name: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            binary: agentdoctor
          - name: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            binary: agentdoctor
          - name: x86_64-apple-darwin
            os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            binary: agentdoctor
          - name: aarch64-apple-darwin
            os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            binary: agentdoctor

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build -p agentdoctor-cli --release --locked --target ${{ matrix.target }}

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          package="agentdoctor-${tag}-${{ matrix.target }}"
          mkdir -p "dist/${package}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${package}/"
          cp README.md LICENSE "dist/${package}/"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            (cd dist && 7z a "${package}.zip" "${package}" >/dev/null)
          else
            tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          fi

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum agentdoctor-*.* > SHA256SUMS-${{ matrix.target }}.txt
          else
            shasum -a 256 agentdoctor-*.* > SHA256SUMS-${{ matrix.target }}.txt
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: agentdoctor-${{ matrix.target }}
          path: |
            dist/agentdoctor-*.zip
            dist/agentdoctor-*.tar.gz
            dist/SHA256SUMS-*.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/agentdoctor-*.zip
            dist/agentdoctor-*.tar.gz
            dist/SHA256SUMS-*.txt
          generate_release_notes: true
