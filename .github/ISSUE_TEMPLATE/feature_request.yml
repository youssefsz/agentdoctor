name: Feature request
description: Suggest a focused improvement for AgentDoctor.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should AgentDoctor do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional, but useful for scope and tradeoffs.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not require telemetry or AI API calls.
        - label: This can be implemented without moving scan logic into the CLI crate.
