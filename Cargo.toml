[workspace]
members = [
    "crates/agentdoctor-engine",
    "crates/agentdoctor-config",
    "crates/agentdoctor-report",
    "crates/agentdoctor-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/youssefsz/agentdoctor"
homepage = "https://github.com/youssefsz/agentdoctor"
description = "Audit repositories for AI coding agent readiness."

[workspace.dependencies]
agentdoctor-engine = { path = "crates/agentdoctor-engine" }
agentdoctor-config = { path = "crates/agentdoctor-config" }
agentdoctor-report = { path = "crates/agentdoctor-report" }

anyhow = "1"
anstream = "0.6"
anstyle = "1"
assert_cmd = "2"
clap = { version = "4.6.1", features = ["derive"] }
directories = "6"
ignore = "0.4"
inquire = "0.9"
predicates = "3"
pretty_assertions = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "1"
